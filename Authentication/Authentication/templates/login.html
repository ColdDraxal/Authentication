{ load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: '#DC143C',
                        crimsonHover: '#B01030',
                    }
                }
            }
        }
    </script>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-gray-900 overflow-hidden font-sans">

    <!-- Background Image with Dark Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80" 
             alt="Background" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md mx-4 p-8 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl transition-all duration-300 transform hover:scale-[1.01]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
            <p class="text-sm text-gray-500 mt-2">Please enter your details to sign in.</p>
        </div>
        
        {% if error %}
            <p style =" color:red; padding:3px 6px;">{{ error }}</p>
        {% endif %}

        <!-- Login Form -->
        <form class="space-y-5" method="POST">
            
            {% csrf_token %}
            <!-- Username Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Username</label>
                <input type="text" 
                       name="username"
                       required 
                       placeholder="John Doe"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Password</label>
                <input type="password" 
                       name="password"
                       required 
                       placeholder="••••••••"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 text-crimson border-gray-300 rounded focus:ring-crimson accent-crimson">
                    <span class="ml-2">Remember me</span>
                </label>
                <a href="{% url 'forget_password' %}" class="text-crimson font-medium hover:underline">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-3 px-4 bg-crimson text-white font-semibold rounded-lg shadow-md hover:bg-crimsonHover active:scale-[0.98] transition-all duration-200">
                Sign In
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-crimson font-semibold hover:underline">Sign up</a>
        </p>

    </div>

</body>
</html>
