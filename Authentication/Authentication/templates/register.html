<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: '#DC143C',
                        crimsonHover: '#B01030',
                    }
                }
            }
        }
    </script>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-gray-900 overflow-hidden font-sans">

    <!-- Background Image with Dark Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80" 
             alt="Background" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Registration Container -->
    <div class="relative z-10 w-full max-w-md mx-4 p-8 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl transition-all duration-300 transform hover:scale-[1.01]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Create Account</h2>
            <p class="text-sm text-gray-500 mt-2">Please fill in your details to get started.</p>
        </div>

        <!-- Registration Form -->
        <form class="space-y-4" onsubmit="event.preventDefault();">
            
            <!-- Full Name Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Full Name</label>
                <input type="text" 
                       required 
                       placeholder="John Doe"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Email Address</label>
                <input type="email" 
                       required 
                       placeholder="name@example.com"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Password</label>
                <input type="password" 
                       required 
                       placeholder="••••••••"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Terms and Conditions Checkbox -->
            <div class="flex items-center text-sm pt-1">
                <label class="flex items-center text-gray-600 cursor-pointer">
                    <input type="checkbox" required class="w-4 h-4 text-crimson border-gray-300 rounded focus:ring-crimson accent-crimson">
                    <span class="ml-2">I agree to the <a href="#" class="text-crimson font-medium hover:underline">Terms & Conditions</a></span>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-3 px-4 bg-crimson text-white font-semibold rounded-lg shadow-md hover:bg-crimsonHover active:scale-[0.98] transition-all duration-200 mt-2">
                Sign Up
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account? 
            <a href="#" class="text-crimson font-semibold hover:underline">Sign in</a>
        </p>

    </div>

</body>
</html>
