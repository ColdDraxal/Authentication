<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        crimson: '#DC143C',
                        crimsonHover: '#B01030',
                    }
                }
            }
        }
    </script>
</head>
<body class="relative flex items-center justify-center min-h-screen bg-gray-900 overflow-hidden font-sans">

    <!-- Background Image with Dark Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80" 
             alt="Background" 
             class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <!-- Forgot Password Container -->
    <div class="relative z-10 w-full max-w-md mx-4 p-8 bg-white/95 backdrop-blur-md rounded-xl shadow-2xl transition-all duration-300 transform hover:scale-[1.01]">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900 tracking-tight">Reset Password</h2>
            <p class="text-sm text-gray-500 mt-2">Enter your email address and we'll send you instructions to reset your password.</p>
        </div>

        <!-- Forgot Password Form -->
        <form class="space-y-5" onsubmit="event.preventDefault();">
            
            <!-- Email Input -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Email Address</label>
                <input type="email" 
                       required 
                       placeholder="name@example.com"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 text-sm focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full py-3 px-4 bg-crimson text-white font-semibold rounded-lg shadow-md hover:bg-crimsonHover active:scale-[0.98] transition-all duration-200">
                Send Reset Instructions
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-sm text-gray-600 mt-6">
            Remembered your password? 
            <a href="#" class="text-crimson font-semibold hover:underline">Sign in</a>
        </p>

    </div>

</body>
</html>
